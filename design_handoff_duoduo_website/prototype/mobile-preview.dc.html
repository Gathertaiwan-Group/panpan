<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#EFE6E1;font-family:"Noto Sans TC",sans-serif}a{color:#8C4A46}a:hover{color:#A9605A}</style>
</helmet>
<div style="padding:48px 44px;display:flex;flex-direction:column;gap:32px">
  <div style="display:flex;flex-direction:column;gap:8px">
    <span style="font-family:'Noto Serif TC',serif;font-size:24px;letter-spacing:.16em;color:#3A2826">朵朵曉語 · 行動版</span>
    <span style="font-size:13px;color:#7A615D;letter-spacing:.06em">390 × 844 · 每支手機都是可操作的完整網站（點右上選單切換頁面）</span>
  </div>
  <div style="display:flex;gap:36px;flex-wrap:wrap;align-items:flex-start">
    <sc-for list="{{ screens }}" as="s" hint-placeholder-count="6">
      <div style="display:flex;flex-direction:column;gap:12px">
        <span style="font-size:13px;letter-spacing:.12em;color:#5A4340">{{ s.label }}</span>
        <div style="width:390px;height:844px;border-radius:46px;background:#2B1E1C;padding:10px;box-shadow:0 20px 50px rgba(58,40,38,.18)">
          <iframe src="{{ s.src }}" title="{{ s.label }}" style="width:370px;height:824px;border:0;border-radius:37px;background:#FAF5F2;display:block"></iframe>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const f = 'site.dc.html';
    return { screens: [
      ['首頁','page=home'],['好好告別','page=farewell'],['體驗詳細頁','page=set&set=0'],
      ['關於朵朵','page=about'],['新生故事','page=stories'],['朵朵曉語 · 文章','page=article&article=0'],['一起創造美好','page=partner']
    ].map(([label,q]) => ({ label, src: f + '?' + q })) };
  }
}
</script>
</body>
</html>
